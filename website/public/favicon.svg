<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Deep Ocean Gradient -->
    <linearGradient id="oceanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Radar Sweep Glow Gradient -->
    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Spill Blip Glow Filter -->
    <filter id="blipGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern App Squircle Base with Maritime Gradient -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#oceanBg)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.5"/>

  <!-- Outer Radar Range Ring -->
  <circle cx="32" cy="32" r="22" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4"/>
  
  <!-- Middle Radar Range Ring -->
  <circle cx="32" cy="32" r="14" fill="none" stroke="#38bdf8" stroke-width="1.75" stroke-opacity="0.55"/>

  <!-- Inner Radar Range Ring -->
  <circle cx="32" cy="32" r="6" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.75"/>

  <!-- Radar Crosshairs (Compass Coordinates) -->
  <line x1="32" y1="9" x2="32" y2="55" stroke="#38bdf8" stroke-width="1.25" stroke-opacity="0.4" stroke-dasharray="3 3"/>
  <line x1="9" y1="32" x2="55" y2="32" stroke="#38bdf8" stroke-width="1.25" stroke-opacity="0.4" stroke-dasharray="3 3"/>

  <!-- Radar Sweep Sector (45-degree active scan cone) -->
  <path d="M32 32 L47.5 16.5 A22 22 0 0 0 32 10 Z" fill="url(#sweepGrad)"/>
  <line x1="32" y1="32" x2="47.5" y2="16.5" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round"/>

  <!-- Radar Core / Sensor Origin -->
  <circle cx="32" cy="32" r="2.5" fill="#f8fafc"/>

  <!-- Satellite Oil Spill Detection Ping (Vibrant Emerald Beacon) -->
  <circle cx="43" cy="21" r="3.5" fill="#10b981" filter="url(#blipGlow)"/>
  <circle cx="43" cy="21" r="5.5" fill="none" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.8"/>

  <!-- Ocean Current / Marine Drift Waves -->
  <path d="M16 48 C 22 45, 26 51, 32 48 C 38 45, 42 51, 48 48" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.7"/>
</svg>